# Dependency vulnerabilities, in tiers:
# - runtime dependencies (what `npm install better-auth-scim-provisioning` brings in) BLOCK: a
#   production-only pnpm audit on every push and PR, and GitHub's dependency review on what a PR adds;
# - everything in the lockfile, dev tooling included, is scanned by OSV-Scanner and REPORTED
#   under Security > Code scanning without blocking (dev tools don't ship).
name: Dependencies
on:
  push: { branches: [main] }
  pull_request:
  schedule: [{ cron: "41 5 * * *" }]
permissions: { contents: read }
jobs:
  # Blocking: what `npm install better-auth-scim-provisioning` brings in.
  runtime-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24 }
      - run: pnpm audit --prod --audit-level low

  review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: low
          fail-on-scopes: runtime
          # Licences a MIT package can depend on at runtime.
          allow-licenses: MIT, ISC, Apache-2.0, BSD-2-Clause, BSD-3-Clause, 0BSD, BlueOak-1.0.0, CC0-1.0, Unlicense, Python-2.0
          # npm itself (Artistic-2.0) is the release job's CLI (.github/npm-cli), run in CI, never shipped.
          allow-dependencies-licenses: pkg:npm/npm
          comment-summary-in-pr: never

  osv:
    if: github.event_name != 'pull_request'
    permissions: { contents: read, security-events: write, actions: read }
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: --lockfile=./pnpm-lock.yaml
      fail-on-vuln: false
