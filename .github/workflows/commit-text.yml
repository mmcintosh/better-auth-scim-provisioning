# Fails a pull request (title, description, commits) or a push to main whose text has a
# trailer or footer line matching the pattern below.
name: Commit text
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, edited, reopened, synchronize]
permissions: { contents: read }
jobs:
  commit-text:
    runs-on: ubuntu-24.04
    permissions: { contents: read, pull-requests: read }
    steps:
      - name: Check titles, descriptions and commit messages
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          pattern='co-authored-by:.*(claude|anthropic|copilot|openai|chatgpt|gemini|cursor)|generated (with|by) \[?(claude|copilot|chatgpt|gemini|cursor)|claude\.(ai|com)/code'
          if [ "$EVENT" = pull_request ]; then
            text=$(printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY"; gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].commit.message')
          elif [ -n "${BEFORE//0/}" ] && gh api "repos/$REPO/compare/$BEFORE...$AFTER" --silent 2>/dev/null; then
            text=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.commits[].commit.message')
          else
            text=$(gh api "repos/$REPO/commits/$AFTER" --jq .commit.message)
          fi
          if hits=$(printf '%s\n' "$text" | grep -inE "$pattern"); then
            echo "::error::Remove these lines:"
            printf '%s\n' "$hits"
            exit 1
          fi
          echo "OK."
