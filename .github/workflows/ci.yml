# Tested at the peer range's minimum and the latest 1.7.x, on the oldest and newest Node LTS.
# Runners are pinned to ubuntu-24.04 (not ubuntu-latest), and every action to a SHA.
name: CI
on:
  push: { branches: [main] }
  pull_request:
# Least privilege: jobs only read the repository (OpenSSF Scorecard: Token-Permissions).
permissions: { contents: read }
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        better-auth: ["1.7.5", "latest-1.7"]
        node: [24]
        include:
          - { better-auth: "1.7.5", node: 22 } # oldest Node LTS still maintained
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "${{ matrix.node }}", cache: pnpm }
      # Socket Firewall: blocks packages Socket has confirmed as malware before they download.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with: { mode: firewall-free }
      - run: sfw pnpm install --frozen-lockfile
      - run: sfw scripts/use-better-auth.sh ${{ matrix.better-auth }}
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test # SQLite (node:sqlite), the mock SCIM app, the regression tests
      - run: pnpm pack:check # dist build, strict host under TypeScript 5.9 and 7, publint, Are the Types Wrong

  # The outbox on real databases: its leases, version checks, dates and booleans are what differ
  # (real MySQL and MongoDB have shown bugs that SQLite and Postgres don't).
  adapters:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: postgres
            url: postgres://postgres:test@localhost:5432/postgres
          - db: mysql
            url: mysql://root:test@127.0.0.1:3306/mysql
          - db: mongodb
            url: mongodb://127.0.0.1:27017/?replicaSet=rs0&directConnection=true
          # The same servers through Drizzle and Prisma 7, with schemas built from Better Auth's
          # table definitions (test/adapters/orm-schemas.ts).
          - db: drizzle-postgres
            url: postgres://postgres:test@localhost:5432/postgres
          - db: drizzle-mysql
            url: mysql://root:test@127.0.0.1:3306/mysql
          - db: prisma-postgres
            url: postgres://postgres:test@localhost:5432/postgres
          # Cloudflare D1, local through Miniflare (its 100-parameter limit included); no server.
          - db: d1
            url: ""
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      mysql:
        image: mysql:8.4@sha256:0744ee5ef89ce6ccfa13de3e579fe6b9e27f93dd70da9c06d2c908b1b193fb8d
        env: { MYSQL_ROOT_PASSWORD: test }
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -ptest --silent" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      # Socket Firewall: blocks packages Socket has confirmed as malware before they download.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with: { mode: firewall-free }
      - run: sfw pnpm install --frozen-lockfile
      - if: matrix.db == 'mongodb'
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:8.2@sha256:e0ce8c35124d4a9f9785532d1f268f39e9728ffa1cb38f46fa482436424c4bd3 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' 2>/dev/null | grep -q 1 && break; sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'rs.status().myState' 2>/dev/null | grep -q '^1$' && break; sleep 2; done
      - run: npx vitest run test/adapters
        env: { ADAPTER_DB: "${{ matrix.db }}", ADAPTER_URL: "${{ matrix.url }}", ADAPTER_REQUIRED: "1" }

  # The built package on Bun and Deno (Better Auth supports both): the `check` CLI against a small
  # SCIM app, and a user's life delivered to it and to a signed webhook (test/runtimes/smoke.mjs).
  runtimes:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        runtime: [bun, deno]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      # Socket Firewall: blocks packages Socket has confirmed as malware before they download.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with: { mode: firewall-free }
      - run: sfw pnpm install --frozen-lockfile && pnpm build
      - run: node test/runtimes/smoke.mjs
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - if: matrix.runtime == 'bun'
        run: bun --version && bun test/runtimes/smoke.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with: { deno-version: v2.x }
      - if: matrix.runtime == 'deno'
        run: deno --version && deno run -A test/runtimes/smoke.mjs

  # The Workers example as a user installs it: this repository's package, packed as npm would
  # publish it, into the example's own install; then its typecheck against the Workers types and
  # Wrangler's build. test/example/ runs it inside workerd in the test job.
  example:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 24, cache: pnpm }
      # Socket Firewall: blocks packages Socket has confirmed as malware before they download.
      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with: { mode: firewall-free }
      - run: sfw pnpm install --frozen-lockfile && pnpm build && pnpm pack --pack-destination "$RUNNER_TEMP"
      - working-directory: examples/workers
        run: |
          sfw npm ci --no-audit --no-fund
          sfw npm install --no-save --no-audit --no-fund "$RUNNER_TEMP"/better-auth-scim-provisioning-*.tgz
          npx tsc -p tsconfig.json
          npx wrangler deploy --dry-run --outdir dist

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0@sha256:cdbb7c955abce02001a9f6c9f602fb195b7fadc1e812065883f695d1eeaba854 git /repo --no-banner --redact -c /repo/.gitleaks.toml
