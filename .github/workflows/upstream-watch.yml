# Weekly: what Dependabot doesn't cover (Better Auth against the peer range, vendored builds of
# unreleased upstream code, updates held back on purpose). Keeps one open "Upstream watch" issue
# up to date and comments when something changed (scripts/upstream-watch.mjs). Never blocks PRs.
name: Upstream watch
on:
  schedule: [{ cron: "17 6 * * 1" }]
  workflow_dispatch:
permissions: { contents: read, issues: write }
jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24 }
      - run: node scripts/upstream-watch.mjs
        env: { GITHUB_TOKEN: "${{ github.token }}" }
